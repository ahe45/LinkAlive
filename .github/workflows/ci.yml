name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: mysql://linkalive:linkalive@127.0.0.1:3306/linkalive
      REDIS_URL: redis://127.0.0.1:6379
      ADMIN_USERNAME: ci-admin
      ADMIN_PASSWORD: ci-only-strong-password
      AUTH_SECRET: ci-only-session-signing-secret-at-least-32-characters
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      WEB_ORIGIN: http://127.0.0.1:3001
      APP_BASE_URL: http://127.0.0.1:3001
      COOKIE_SECURE: 'false'
      API_PORT: '4000'
      SCHEDULER_HEALTH_PORT: '4101'
      WORKER_HEALTH_PORT: '4102'
    services:
      mysql:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: linkalive
          MARIADB_USER: linkalive
          MARIADB_PASSWORD: linkalive
          MARIADB_ROOT_PASSWORD: linkalive-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Compose configurations
        shell: bash
        run: |
          cp .env.example .env
          docker compose --env-file .env -f infra/compose.yaml -f infra/compose.app.yaml config --quiet
          docker compose --env-file .env -f infra/compose.prod.yaml config --quiet
          rm .env

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run MariaDB and Redis full-flow integration test
        env:
          LINKALIVE_INTEGRATION_TESTS: 'true'
        run: |
          pnpm --filter @linkalive/database test:integration
          pnpm --filter @linkalive/worker test:integration

      - name: Build production artifacts
        run: pnpm build

      - name: Smoke test runtime health
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -Eeuo pipefail

          api_log="$RUNNER_TEMP/linkalive-api.log"
          scheduler_log="$RUNNER_TEMP/linkalive-scheduler.log"
          worker_log="$RUNNER_TEMP/linkalive-worker.log"

          node apps/api/dist/main.js >"$api_log" 2>&1 &
          api_pid=$!
          node apps/scheduler/dist/index.js >"$scheduler_log" 2>&1 &
          scheduler_pid=$!
          node apps/worker/dist/index.js >"$worker_log" 2>&1 &
          worker_pid=$!

          cleanup() {
            kill "$api_pid" "$scheduler_pid" "$worker_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          wait_for_health() {
            local name="$1"
            local url="$2"
            local pid="$3"
            local log="$4"

            for _ in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 3 "$url" >/dev/null; then
                echo "$name health check passed"
                return 0
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "$name exited before becoming healthy"
                cat "$log"
                return 1
              fi
              sleep 1
            done

            echo "$name did not become healthy in time"
            cat "$log"
            return 1
          }

          wait_for_health api http://127.0.0.1:4000/health/ready "$api_pid" "$api_log"
          wait_for_health scheduler http://127.0.0.1:4101/health "$scheduler_pid" "$scheduler_log"
          wait_for_health worker http://127.0.0.1:4102/health "$worker_pid" "$worker_log"

          cookie_jar="$RUNNER_TEMP/linkalive-cookie.txt"
          curl --fail --silent --show-error \
            --cookie-jar "$cookie_jar" \
            --header 'content-type: application/json' \
            --header 'origin: http://127.0.0.1:3001' \
            --data '{"username":"ci-admin","password":"ci-only-strong-password"}' \
            http://127.0.0.1:4000/api/v1/auth/login >/dev/null
          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            http://127.0.0.1:4000/api/v1/auth/me >/dev/null
          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            http://127.0.0.1:4000/api/v1/dashboard/summary >/dev/null

          monitor_payload="$(
            jq --null-input --compact-output \
              --arg url "https://linkalive-${GITHUB_RUN_ID}.invalid/health" \
              '{
                name: "CI scheduled outage",
                url: $url,
                method: "GET",
                intervalSec: 60,
                timeoutMs: 3000,
                expectedStatusMin: 200,
                expectedStatusMax: 299,
                expectedKeyword: "",
                followRedirects: true,
                maxRedirects: 5,
                failureThreshold: 1,
                recoveryThreshold: 1,
                channelIds: []
              }'
          )"
          monitor_id="$(
            curl --fail --silent --show-error \
              --cookie "$cookie_jar" \
              --header 'content-type: application/json' \
              --header 'origin: http://127.0.0.1:3001' \
              --data "$monitor_payload" \
              http://127.0.0.1:4000/api/v1/monitors \
              | jq --exit-status --raw-output '.id'
          )"

          # Keep the smoke test fast while still exercising the real
          # scheduler -> BullMQ -> worker path.
          MONITOR_ID="$monitor_id" node --input-type=module <<'NODE'
          import { prisma } from './packages/database/dist/index.js'
          if (!process.env.MONITOR_ID) throw new Error('MONITOR_ID is required')
          await prisma.monitor.update({
            where: { id: process.env.MONITOR_ID },
            data: { nextCheckAt: new Date() },
          })
          await prisma.$disconnect()
          NODE

          monitor_state=""
          for _ in $(seq 1 40); do
            monitor_state="$(
              curl --fail --silent --show-error \
                --cookie "$cookie_jar" \
                "http://127.0.0.1:4000/api/v1/monitors/$monitor_id" \
                | jq --exit-status --raw-output '.healthState'
            )"
            if [[ "$monitor_state" == 'DOWN' ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$monitor_state" != 'DOWN' ]]; then
            echo "scheduled monitor did not transition to DOWN"
            cat "$scheduler_log" "$worker_log"
            exit 1
          fi

          incident_id="$(
            curl --fail --silent --show-error \
              --cookie "$cookie_jar" \
              "http://127.0.0.1:4000/api/v1/monitors/$monitor_id/incidents?limit=1" \
              | jq --exit-status --raw-output '.items[0].id'
          )"
          curl --fail --silent --show-error \
            --cookie "$cookie_jar" \
            "http://127.0.0.1:4000/api/v1/incidents/$incident_id" >/dev/null
